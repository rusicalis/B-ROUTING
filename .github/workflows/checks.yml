name: Workout checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  workout:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test
      - run: node --check app.js && node --check illustrated-guide.mjs && node --check service-worker.js
